name: Tencent Cloud release

on:
  workflow_run:
    workflows: [Baseline checks, Frontend system redesign review, AI interaction checks, Account lifecycle checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: cloud-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'hxjyaohaohaode/AI-xiutu' &&
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
       github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require all four checks from the same main push
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          api="repos/$GITHUB_REPOSITORY"
          head=$(gh api "$api/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$RELEASE_SHA" ]]; then
            echo "A newer main commit is available."
            exit 0
          fi
          for workflow in checks.yml frontend-system-redesign.yml assistant-checks.yml account-checks.yml; do
            result=$(gh api "$api/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$RELEASE_SHA&per_page=5" \
              | jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")][0].conclusion // "pending"')
            if [[ "$result" != success ]]; then
              echo "$workflow: $result; waiting for a verified main."
              exit 0
            fi
          done
          if [[ $(gh release view "cloud-$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true) == false ]]; then
            echo "Release already published."
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.checked.outputs.ready == 'true'
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Verify release transfer, pilot HTTPS and rollback history
        if: steps.checked.outputs.ready == 'true'
        run: |
          python3 -B infra/tencent/test-fetch-release.py
          python3 -B infra/tencent/test-pilot-verify.py
      - name: Build revision-labelled Linux images
        if: steps.checked.outputs.ready == 'true'
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" == "$(git rev-parse HEAD)" ]]
          compose_hash=$(sha256sum compose.yaml | cut -d ' ' -f 1)
          for role in server web; do
            build_target=$role
            if [[ "$role" == server ]]; then build_target=server-media; fi
            docker build --platform linux/amd64 --file infra/Dockerfile --target "$build_target" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "io.ai-xiutu.compose-sha256=$compose_hash" \
              --label "io.ai-xiutu.build-target=$build_target" \
              --tag "xiutu-pilot-$role:$RELEASE_SHA" .
          done
      - name: Import a 10-bit HDR image in the exact server candidate
        if: steps.checked.outputs.ready == 'true'
        run: |
          set -euo pipefail
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 192 --memory 4g --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$PWD/packages/media/test/fixtures/pq10.heic,dst=/fixture.heic,readonly" \
            "xiutu-pilot-server:$RELEASE_SHA" node --import tsx --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFile, stat } from 'node:fs/promises';
          import { getMediaCapabilities, processMedia } from '@ai-xiutu/media';
          assert.notEqual(process.getuid(), 0);
          const langs = execFileSync('tesseract', ['--list-langs'], { encoding: 'utf8' }).split(/\s+/);
          assert.ok(langs.includes('eng') && langs.includes('chi_sim'), 'OCR language data missing');
          const options = {
            pythonExecutable: process.env.MEDIA_PYTHON, ultraHdrLibrary: process.env.MEDIA_UHDR_LIBRARY,
            heicDecoder: process.env.MEDIA_HEIC_DECODER,
          };
          const c = await getMediaCapabilities(options);
          assert.ok(c.available && c.nativeReady && c.heicPq.available && c.heicHlg.available && c.ultraHdrJpeg.available,
            JSON.stringify({ isolation: c.isolation, nativeVersions: c.nativeVersions }));
          const origin = '/fixture.heic', workDir = '/tmp/media';
          const d = await processMedia({ inputPath: origin, workDir, originalName: 'fixture.heic', options });
          assert.deepEqual([d.master.width, d.master.height, d.original.sampleEncoding,
            d.original.decodedBitDepth, d.linearMaster?.bitDepth], [32, 24, 'pq', 10, 32]);
          assert.deepEqual(await readFile(workDir + '/' + d.original.relativePath), await readFile(origin));
          assert.ok((await stat(workDir + '/' + d.linearMaster.relativePath)).size > 0);
          console.log(JSON.stringify({ isolation: c.isolation, nativeVersions: c.nativeVersions, fixture: 'PQ10' }));
          JS
      - name: Package verified candidate images and measure publication size
        if: steps.checked.outputs.ready == 'true'
        run: |
          set -euo pipefail
          docker image save "xiutu-pilot-server:$RELEASE_SHA" "xiutu-pilot-web:$RELEASE_SHA" \
            | gzip -1 > xiutu-linux-amd64.tar.gz
          bundle_bytes=$(stat -c '%s' xiutu-linux-amd64.tar.gz)
          {
            echo '### Tencent release size (bytes)'
            for role in server web; do
              bytes=$(docker image inspect --format '{{.Size}}' "xiutu-pilot-$role:$RELEASE_SHA")
              echo "- $role image: $bytes"
            done
            echo "- Compressed transfer: $bundle_bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$bundle_bytes" -gt 0 && test "$bundle_bytes" -lt 2000000000
      - name: Publish the complete bundle
        if: steps.checked.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          tag="cloud-$RELEASE_SHA"
          check_head() {
            [[ $(gh api "$api/git/ref/heads/main" --jq .object.sha) == "$RELEASE_SHA" ]]
          }
          if ! check_head; then
            echo "Main moved while preparing the release; no release published."
            exit 0
          fi
          if ! gh release view "$tag" --json isDraft > /dev/null 2>&1; then
            gh release create "$tag" --target "$RELEASE_SHA" --title "Tencent Cloud ${RELEASE_SHA:0:12}" \
              --notes "Automated Linux images for the checked main commit $RELEASE_SHA." \
              --draft --prerelease --latest=false
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" xiutu-linux-amd64.tar.gz --clobber
          if ! check_head; then
            echo "Main moved during upload; the bundle remains a draft."
            exit 0
          fi
          gh release edit "$tag" --draft=false --prerelease --latest=false
