name: Baseline checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Preserve complete acceptance evidence for every main commit during integration.
  group: checks-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xiutu
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: xiutu_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xiutu -d xiutu_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      BROWSER_CHANNEL: chrome
      TEST_DATABASE_URL: postgresql://xiutu:ci-only-disposable@127.0.0.1:5432/xiutu_browser_test
      DB_POOL_MAX: '8'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify the runner's installed Chrome
        run: google-chrome --version
      - name: Measure continuous slider, curve and touch paints
        run: node --import tsx scripts/qa/interactive-preview.browser.mjs
      - name: Preserve preview timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interactive-preview-${{ github.sha }}
          path: artifacts/interactive-preview
          retention-days: 14
      - name: Six complete browser flows on this commit
        run: |
          for round in 1 2 3 4 5 6; do
            BROWSER_ARTIFACT_DIR="artifacts/browser-v4/round-${round}" node --import tsx scripts/qa/workspace-v4.browser.mjs
          done
      - name: Preserve measurements, downloaded-image checks and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-v4-${{ github.sha }}
          path: artifacts/browser-v4
          retention-days: 14
          if-no-files-found: error
      - name: Assistant permissions, memory, streaming, conversations and generated workspace
        run: node --import tsx scripts/qa/assistant.browser.mjs
      - name: Team voice microphones, permissions and shared AI speaker
        run: node --import tsx scripts/qa/team-voice.browser.mjs
      - name: Preserve team voice evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-team-voice-${{ github.sha }}
          path: artifacts/browser-team-voice
          retention-days: 14
          if-no-files-found: error
      - name: Real portrait inference and full/tiled pixel comparison
        run: |
          npm run vision:prepare
          node --import tsx scripts/qa/spatial-quality.browser.mjs
      - name: Diverse real-photo beauty, matte and sports restoration observations
        run: node --import tsx scripts/qa/photo-quality.browser.mjs
      - name: Preserve diverse-photo references and observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-quality-${{ github.sha }}
          path: artifacts/photo-quality
          retention-days: 14
          if-no-files-found: error
      - name: Preserve real-photo pixel measurements and contact sheets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spatial-quality-${{ github.sha }}
          path: artifacts/spatial-quality
          retention-days: 14
          if-no-files-found: error
      - name: Preserve assistant browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-assistant-${{ github.sha }}
          path: artifacts/browser-assistant
          retention-days: 14
          if-no-files-found: error
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xiutu
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: xiutu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xiutu -d xiutu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://xiutu:ci-only-disposable@127.0.0.1:5432/xiutu_test
      REQUIRE_DB_TESTS: '1'
      REQUIRE_NATIVE_OCR: '1'
      DB_POOL_MAX: '10'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and check with the application native runtime
        run: |
          docker build --target server-media --tag xiutu-native-check -f infra/Dockerfile .
          docker run --rm --network host --user root \
            --env TEST_DATABASE_URL --env REQUIRE_DB_TESTS --env REQUIRE_NATIVE_OCR \
            --env DB_POOL_MAX --env NODE_ENV=test xiutu-native-check bash -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-cjk
              export MEDIA_QA_PYTHON="$MEDIA_PYTHON"
              runuser -u node -- npm test
              runuser -u node -- npm audit --omit=dev --audit-level=high
            '
  containers:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: xiutu-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create isolated configuration with external execution disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from secrets import token_hex
          values = {
              'POSTGRES_PASSWORD': token_hex(24),
              'SESSION_SECRET': token_hex(32),
              'APP_ORIGIN': 'http://127.0.0.1',
              'APP_DOMAIN': ':80',
              # Compose must override this development-only value to internal 3001.
              'PORT': '3999',
              'COOKIE_SECURE': 'false',
              'AI_PLAN_ENABLED': 'false',
              'AI_TEXT_ENABLED': 'false',
              'AI_IMAGE_ENABLED': 'false',
              'AI_SPEECH_ENABLED': 'false',
              'AI_ASSISTANT_ENABLED': 'false',
              'AI_VOICE_ENABLED': 'false',
              'MEDIA_ADVANCED_ENABLED': 'false',
              'OPENAI_API_KEY': '',
              'DASHSCOPE_API_KEY': '',
              'ARK_API_KEY': '',
              'TENCENT_SECRET_ID': '',
              'TENCENT_SECRET_KEY': '',
              'ARK_IMAGE_MODELS_JSON': '[]',
              'QWEN_ASR_MODELS': '',
          }
          target = Path('.env')
          target.write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          target.chmod(0o600)
          PY
      - name: Validate and build both Docker targets
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.media.yaml config --quiet
          docker compose build
      - name: Build optional native media runtime and verify its actual libraries
        run: |
          docker build --target server-media --tag xiutu-media-ci -f infra/Dockerfile .
          docker run --rm --memory 4g --pids-limit 192 --cap-drop ALL --security-opt no-new-privileges xiutu-media-ci node --import tsx --input-type=module -e 'import {getMediaCapabilities} from "@ai-xiutu/media"; const c=await getMediaCapabilities({pythonExecutable:process.env.MEDIA_PYTHON}); if(!c.available||!c.nativeReady)process.exit(1); console.log(JSON.stringify({isolation:c.isolation,nativeVersions:c.nativeVersions}));'
          docker run --rm --memory 4g --pids-limit 192 --cap-drop ALL --security-opt no-new-privileges xiutu-media-ci node --import tsx --test packages/media/test/media.test.ts
          docker run --rm --memory 4g --pids-limit 192 --cap-drop ALL --security-opt no-new-privileges --env MEDIA_QA_PYTHON=/opt/media/bin/python xiutu-media-ci node --import tsx --test packages/media/test/precision.test.ts
      - name: Start PostgreSQL, migration, API, worker and web
        run: docker compose up --detach --no-build
      - name: Verify HTTP, health, disabled external services and private network bindings
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          from urllib.request import urlopen
          from urllib.error import HTTPError, URLError

          base = 'http://127.0.0.1'
          deadline = time.monotonic() + 90
          while True:
              try:
                  with urlopen(base + '/health', timeout=4) as response:
                      assert json.load(response)['ok'] is True
                  break
              except (OSError, URLError, AssertionError, ValueError):
                  if time.monotonic() >= deadline:
                      raise SystemExit('The public health endpoint did not become ready.')
                  time.sleep(2)

          with urlopen(base + '/v1/public-config', timeout=5) as response:
              config = json.load(response)
          assert config['brand']['name']
          assert config['capabilities']['aiConfigured'] is False
          assert config['capabilities']['smsConfigured'] is False
          assert config['capabilities']['paymentConfigured'] is False
          assert config['capabilities']['availableOperations'] == []
          assert config['media']['canonical'] == 'png'
          with urlopen(base + '/', timeout=5) as response:
              assert 'text/html' in response.headers['Content-Type']
              assert "'wasm-unsafe-eval'" in response.headers['Content-Security-Policy']
              assert 'id="root"' in response.read().decode()
          with urlopen(base + '/vision/manifest.json', timeout=5) as response:
              vision = json.load(response)
              assert vision['schemaVersion'] == 1 and vision['sdkVersion'] == '1.2.2'
              assert len(vision['assets']) == 3
          import hashlib
          for item in vision['assets']:
              with urlopen(base + '/vision/' + item['file'], timeout=15) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == item['sha256']
          try:
              urlopen(base + '/vision/missing-file.task', timeout=5)
          except HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError('Missing model file incorrectly fell back to HTML.')
          try:
              urlopen(base + '/v1/projects', timeout=5)
          except HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('Private API accepted an unauthenticated request.')

          states = {}
          for service in ('db', 'migrate', 'api', 'worker', 'web'):
              identifier = subprocess.check_output(['docker', 'compose', 'ps', '-a', '-q', service], text=True).strip()
              assert identifier and '\n' not in identifier, f'Missing or unexpected service: {service}'
              state = json.loads(subprocess.check_output(['docker', 'inspect', identifier], text=True))[0]
              states[service] = state
              if service == 'migrate':
                  assert state['State']['Status'] == 'exited' and state['State']['ExitCode'] == 0
              else:
                  assert state['State']['Running'] is True, f'Service stopped: {service}'
              if service in ('db', 'api', 'worker'):
                  assert not state['HostConfig']['PortBindings'], f'Private service published host ports: {service}'
          assert states['api']['State']['Health']['Status'] == 'healthy'
          assert states['db']['State']['Health']['Status'] == 'healthy'
          for service in ('api', 'worker'):
              destinations = {mount['Destination'] for mount in states[service]['Mounts']}
              assert {'/app/.data/private', '/app/.data/ai-dispatch-journal'} <= destinations
          print('Container smoke checks passed; no SMS or model request was enabled or sent.')
          PY
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Remove isolated containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
