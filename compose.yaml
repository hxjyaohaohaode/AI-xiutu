name: ai-xiutu
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: xiutu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xiutu
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U xiutu -d xiutu]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xiutu:${POSTGRES_PASSWORD}@db:5432/xiutu
    command: [node, --import, tsx, packages/db/src/migrate.ts]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xiutu:${POSTGRES_PASSWORD}@db:5432/xiutu
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY_HOPS: 1
      HOST: 0.0.0.0
      STORAGE_DIR: /app/.data/private
      AI_JOURNAL_DIR: /app/.data/ai-dispatch-journal
    volumes:
      - assets:/app/.data/private
      - dispatch:/app/.data/ai-dispatch-journal
      - ./.data/support:/app/.data/support:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "const r=await fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(3000)});if(!r.ok||(await r.json()).ok!==true)process.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: server
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xiutu:${POSTGRES_PASSWORD}@db:5432/xiutu
      AI_JOURNAL_DIR: /app/.data/ai-dispatch-journal
      STORAGE_DIR: /app/.data/private
      NODE_ENV: production
    command: [node, --import, tsx, apps/worker-ai/src/index.ts]
    volumes:
      - dispatch:/app/.data/ai-dispatch-journal
      - assets:/app/.data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  assets:
  dispatch:
  caddy_data:
  caddy_config:
